<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A14 Review: Forces, Motion and Energy</title>
<style>
:root{--navy:#1A2F44;--amb:#EF9D2D;--pale:#FBF1D6;--green:#1B6B2F;--red:#B3261E;--line:#C9D3DD;--bg:#F5F7FA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Arial,Helvetica,sans-serif;font-size:19px;line-height:1.35}
button,select,input{font:inherit;color:inherit}
#app{max-width:1000px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:5;background:var(--pale);border-bottom:3px solid var(--amb);margin:0 -16px;padding:10px 16px}
.top .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.home{background:#fff;border:2px solid var(--navy);border-radius:8px;padding:4px 12px;font-weight:bold;font-size:15px;cursor:pointer}
.sec{font-weight:bold;font-size:20px}.cnt{font-size:17px}
.bar{height:10px;background:#fff;border:1px solid var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--navy)}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px}
h1{font-size:30px;margin:18px 0 6px}h2{font-size:24px;margin:0 0 8px}
.q{font-size:21px;font-weight:bold;margin:0 0 6px}
.hint{font-size:16px;color:#4a5b6c;margin:4px 0 12px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:bold;cursor:pointer;font-size:19px}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.amb{background:var(--amb);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer;background:#fff}
.opt.on{border-color:var(--navy);background:var(--pale)}
.opt input{margin-top:4px;width:20px;height:20px;flex:none}
.chip{display:inline-block;background:var(--amb);color:var(--navy);border:2px solid var(--navy);border-radius:10px;padding:8px 12px;margin:5px;font-weight:bold;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px;line-height:1.2}
.chip.sel{outline:4px solid #2F6DB5;outline-offset:1px}
.chip.small{padding:5px 9px;margin:3px}
.slot{min-height:52px;border:3px dashed #8AA4C0;border-radius:10px;background:#EAF1FA;display:flex;align-items:center;flex-wrap:wrap;padding:2px;flex:1;min-width:130px}
.slot.over,.zone.over{background:#D5E6FA;border-color:#2F6DB5}
.mrow{display:flex;gap:14px;align-items:center;margin:8px 0;flex-wrap:wrap}
.mrow .lab{flex:1 1 280px}
.tray{margin-top:14px;padding:8px;background:#F0F0F0;border:2px solid #BBB;border-radius:10px;min-height:60px}
.bins{display:grid;gap:12px;margin-top:6px}
.bin h3{margin:0 0 6px;font-size:19px;text-align:center}
.bin .slot{min-height:150px;align-content:flex-start}
.sel-line{display:flex;gap:10px;align-items:center;margin:9px 0;flex-wrap:wrap}
.sel-line .lab{flex:1 1 300px}
select,input[type=text]{border:2px solid var(--navy);border-radius:8px;padding:8px 10px;background:#fff;min-width:150px}
.ck{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:6px 10px;margin:3px;cursor:pointer;background:#fff}
.ck.on{border-color:var(--navy);background:var(--pale)}
.fbdwrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.fbdwrap svg{flex:1 1 520px;max-width:100%;height:auto;background:#fff;border:2px solid var(--line);border-radius:10px;touch-action:none}
.pal{flex:0 0 200px}
.pal .chip{display:block;margin:6px 0;text-align:center;color:#fff}
.pal .chip.used{opacity:.35;cursor:default}
.zone{fill:rgba(0,0,0,.001);stroke:#8AA4C0;stroke-width:3;stroke-dasharray:8 6}
.zone.over{fill:rgba(47,109,181,.15);stroke:#2F6DB5}
.arrowg{cursor:pointer}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}
.bars{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.bctl{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:bold}
.bctl .b{width:44px;height:36px;border-radius:8px;border:2px solid var(--navy);background:#fff;font-size:22px;cursor:pointer;font-weight:bold}
.tot{font-weight:bold;margin:6px 0}
.score{font-size:54px;font-weight:bold}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:bold;font-size:16px}
.pill.ok{background:#CDE8CD;color:var(--green)}.pill.no{background:#F6D5D2;color:var(--red)}
.part{border-left:6px solid var(--line);padding:6px 10px;margin:6px 0;background:#FAFAFA;font-size:17px}
.part.ok{border-color:var(--green)}.part.no{border-color:var(--red);background:#FFF6F5}
.part>b{display:block}
.banner{padding:10px 14px;border-radius:10px;font-weight:bold;font-size:20px;margin-bottom:10px}.banner.ok{background:#CDE8CD;color:var(--green)}.banner.no{background:#F6D5D2;color:var(--red)}
.why{margin-top:8px;padding:8px 12px;background:var(--pale);border-radius:8px;font-size:17px}
.secrow{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.secrow .nm{flex:0 0 230px}
.secrow .bar{flex:1 1 200px;margin:0;height:16px}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qgrid button{width:42px;height:38px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:bold}
.qgrid button.done{background:#CDE8CD;border-color:var(--green)}
.qgrid button.cur{outline:3px solid var(--navy)}
.revfig{display:flex;gap:12px;flex-wrap:wrap}.revfig>div{flex:1 1 300px}.revfig svg{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.cap{font-weight:bold;font-size:15px;margin:4px 0}
.card svg{max-width:100%;height:auto;display:block;margin:6px auto}.bars svg{width:100%;max-width:420px;margin:0}.fbdwrap svg{margin:0}
@media (max-width:600px){html,body{font-size:17px}.score{font-size:42px}}
</style></head><body><div id="app"></div><script>
'use strict';
const FC={Gravity:'#C0392B',Normal:'#1F5FA8',Applied:'#1B6B2F',Push:'#1B6B2F',Pull:'#1B6B2F',Friction:'#D9730D',Tension:'#7B3FA0','Air resistance':'#5D6D7E',Spring:'#138D90','Force of motion':'#888888'};
const ENERGY=['Kinetic','Gravitational PE','Elastic PE','Chemical PE','Thermal'];
const STORE='a14_review_v3';
let S={name:'',ans:{},seed:Math.floor(Math.random()*1e9),i:0,phase:'start',first:null,queue:null,retried:false};
function load(){try{const r=localStorage.getItem(STORE);if(r){const o=JSON.parse(r);if(o&&o.ans)S=Object.assign(S,o);}}catch(e){}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}
function h(tag,attrs){const el=document.createElement(tag);attrs=attrs||{};
  for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k==='text')el.textContent=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?'':v);}
  for(let i=2;i<arguments.length;i++){const c=arguments[i];if(c==null)continue;el.append(c.nodeType?c:document.createTextNode(c));}
  return el;}
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs){const el=document.createElementNS(NS,tag);for(const k in attrs||{})el.setAttribute(k,attrs[k]);for(let i=2;i<arguments.length;i++){const c=arguments[i];if(c)el.append(c.nodeType?c:document.createTextNode(c));}return el;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,seed){const a=arr.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const strip=s=>String(s).replace(/<[^>]*>/g,'');
const numOf=s=>{if(s==null)return NaN;const m=String(s).replace(/,/g,'').match(/-?\d*\.?\d+/);return m?parseFloat(m[0]):NaN;};

// ---------- drag engine (pointer events; tap = select, then tap a target) ----------
let SEL=null; // {q,id}
function makeDrag(el,onDrop,onTap){
  el.addEventListener('pointerdown',function(e){
    if(e.button>0)return; const sx=e.clientX,sy=e.clientY; let ghost=null,moved=false,over=null;
    function target(x,y){if(ghost)ghost.style.display='none';const els=document.elementsFromPoint(x,y);if(ghost)ghost.style.display='';
      for(const t of els){const d=t.closest&&t.closest('[data-drop]');if(d)return d;}return null;}
    function mv(ev){const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!moved&&Math.hypot(dx,dy)>7){moved=true;ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=el.offsetWidth+'px';document.body.append(ghost);}
      if(moved){ev.preventDefault();ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
        const t=target(ev.clientX,ev.clientY);if(over&&over!==t)over.classList.remove('over');over=t;if(t)t.classList.add('over');}}
    function up(ev){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      if(over)over.classList.remove('over');
      if(moved){const t=target(ev.clientX,ev.clientY);if(ghost)ghost.remove();if(t)onDrop(t.getAttribute('data-drop'),t);}
      else onTap();}
    document.addEventListener('pointermove',mv,{passive:false});document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  });
}

// ---------- shared drawing ----------
function arrowPts(dir,x,y,len,th){const d={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]}[dir],p=[-d[1],d[0]];
  const hl=Math.min(30,len*0.45),bt=th/2,hw=th*0.9;
  const loc=[[0,-bt],[len-hl,-bt],[len-hl,-hw],[len,0],[len-hl,hw],[len-hl,bt],[0,bt]];
  return loc.map(q=>(x+q[0]*d[0]+q[1]*p[0]).toFixed(1)+','+(y+q[0]*d[1]+q[1]*p[1]).toFixed(1)).join(' ');}
function blockArrow(g,dir,x,y,len,th,color,cls){return g.appendChild(sv('polygon',{points:arrowPts(dir,x,y,len,th),fill:color,stroke:'#1A2F44','stroke-width':1.5,class:cls||''}));}
const LENPX={1:70,2:115,3:165};
function fbdSvg(q,sides,opts){opts=opts||{};
  const W=720,H=440,cx=360,cy=220,bw=q.obj==='ball'?100:170,bh=q.obj==='ball'?100:100;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
  if(opts.zones){[['U',230,0,260,cy-bh/2-4],['D',230,cy+bh/2+4,260,H-cy-bh/2-4],['L',0,150,cx-bw/2-4,140],['R',cx+bw/2+4,150,W-cx-bw/2-4,140]].forEach(z=>{
    const r=sv('rect',{x:z[1],y:z[2],width:z[3],height:z[4],rx:12,class:'zone','data-drop':z[0]});svg.append(r);});}
  if(q.obj==='ball')svg.append(sv('circle',{cx,cy,r:50,fill:'#F0F0F0',stroke:'#1A2F44','stroke-width':3}));
  else{svg.append(sv('rect',{x:cx-bw/2,y:cy-bh/2,width:bw,height:bh,fill:'#F0F0F0',stroke:'#1A2F44','stroke-width':3,rx:4,'pointer-events':'none'}));
    svg.append(sv('text',{x:cx,y:cy+8,'text-anchor':'middle','font-size':22,'font-weight':'bold',fill:'#1A2F44','pointer-events':'none'},q.objLabel||''));}
  const anchor={U:[cx,cy-bh/2],D:[cx,cy+bh/2],L:[cx-bw/2,cy],R:[cx+bw/2,cy]};
  for(const s of ['U','D','L','R']){const a=sides[s];if(!a)continue;const len=LENPX[a.len||2],[x,y]=anchor[s],col=FC[a.f]||'#555';
    const g=sv('g',{class:'arrowg','data-side':s});svg.append(g);
    blockArrow(g,s,x,y,len,26,col);
    const lab=sv('text',{'font-size':19,'font-weight':'bold',fill:col,stroke:'#fff','stroke-width':4,'paint-order':'stroke'},a.f);
    if(s==='U'||s==='D'){lab.setAttribute('x',x+26);lab.setAttribute('y',y+(s==='U'?-len/2:len/2)+6);}
    else{lab.setAttribute('x',x+(s==='L'?-len/2:len/2));lab.setAttribute('y',y-26);lab.setAttribute('text-anchor','middle');}
    g.append(lab);
    if(opts.edit){const tip={U:[x,y-len],D:[x,y+len],L:[x-len,y],R:[x+len,y]}[s];
      const hit=sv('rect',{x:Math.min(x,tip[0])-14,y:Math.min(y,tip[1])-14,width:Math.abs(tip[0]-x)+28,height:Math.abs(tip[1]-y)+28,fill:'rgba(0,0,0,.001)','data-len':s});g.append(hit);
      const bx={U:[x+60,y-len],D:[x+60,y+len],L:[x-len,y+34],R:[x+len,y+34]}[s];
      const xg=sv('g',{'data-del':s,style:'cursor:pointer'});xg.append(sv('circle',{cx:bx[0],cy:bx[1],r:14,fill:'#fff',stroke:'#B3261E','stroke-width':2.5}));
      xg.append(sv('text',{x:bx[0],y:bx[1]+6,'text-anchor':'middle','font-size':18,'font-weight':'bold',fill:'#B3261E'},'×'));g.append(xg);}}
  return svg;}

// ---------- question type handlers ----------
const T={};
// MC
T.mc={
 render(q,box,a,api){const ord=shuffled(q.options.map((_,i)=>i),S.seed+q.n*7);
  ord.forEach(i=>{const on=a.v===i;const lab=h('label',{class:'opt'+(on?' on':'')},h('input',{type:'radio',name:'o'+q.id,checked:on}),h('span',{html:q.options[i]}));
    lab.querySelector('input').addEventListener('change',()=>{a.v=i;api.save();api.redo();});box.append(lab);});},
 answered:(q,a)=>a.v!=null,
 grade(q,a){const ok=a.v===q.answer;return[{ok,label:'Your choice',got:a.v==null?'(no answer)':strip(q.options[a.v]),exp:strip(q.options[q.answer])}];},
 solve:q=>({v:q.answer})};
// MULTI (select / check / num prompts)
T.multi={
 render(q,box,a,api){a.p=a.p||{};if(q.fig)box.append(typeof q.fig==='function'?q.fig():q.fig);
  q.prompts.forEach((p,i)=>{const row=h('div',{class:'sel-line'});row.append(h('div',{class:'lab',html:p.text}));
   if(p.type==='select'){const s=h('select');s.append(h('option',{value:'',text:'Choose…'}));p.options.forEach((o,j)=>s.append(h('option',{value:j,text:o,selected:a.p[i]===j})));
     s.addEventListener('change',()=>{a.p[i]=s.value===''?undefined:+s.value;api.save();api.redo(true);});row.append(s);}
   else if(p.type==='num'){const inp=h('input',{type:'text',inputmode:'decimal',autocomplete:'off',value:a.p[i]!=null?a.p[i]:'',placeholder:'type a number'});
     inp.addEventListener('input',()=>{a.p[i]=inp.value;api.save();api.redo(true);});row.append(inp);}
   else if(p.type==='check'){const wrap=h('div');(a.p[i]=a.p[i]||[]);p.options.forEach((o,j)=>{const on=a.p[i].includes(j);
     const l=h('label',{class:'ck'+(on?' on':'')},h('input',{type:'checkbox',checked:on}),o);
     l.querySelector('input').addEventListener('change',e=>{const s=new Set(a.p[i]);e.target.checked?s.add(j):s.delete(j);a.p[i]=[...s].sort();api.save();api.redo();});wrap.append(l);});row.append(wrap);}
   box.append(row);});},
 answered:(q,a)=>!!a.p&&q.prompts.some((p,i)=>a.p[i]!=null&&a.p[i]!==''&&!(Array.isArray(a.p[i])&&!a.p[i].length)),
 grade(q,a){a.p=a.p||{};return q.prompts.map((p,i)=>{const v=a.p[i];let ok,got,exp;
   if(p.type==='select'){ok=v===p.answer;got=v==null?'(no answer)':p.options[v];exp=p.options[p.answer];}
   else if(p.type==='num'){const n=numOf(v);ok=Math.abs(n-p.answer)<1e-6;got=(v==null||v==='')?'(no answer)':String(v);exp=String(p.answer)+(p.unit?' '+p.unit:'');}
   else{const g=(v||[]).slice().sort().join(),e=p.answer.slice().sort().join();ok=g===e;got=(v&&v.length)?v.map(j=>p.options[j]).join(', '):'(none chosen)';exp=p.answer.map(j=>p.options[j]).join(', ');}
   return{ok,label:strip(p.text),got,exp};});},
 solve:q=>({p:Object.fromEntries(q.prompts.map((p,i)=>[i,p.type==='check'?p.answer.slice():p.answer]))})};
// PLACE (match / sort / rank)
T.place={
 render(q,box,a,api){a.pl=a.pl||{};const pl=a.pl;
  const items=q.items,targets=q.targets;
  const occ=t=>items.filter(it=>pl[it.id]===t);
  const mkChip=it=>{const c=h('button',{class:'chip'+(SEL&&SEL.q===q.id&&SEL.id===it.id?' sel':''),type:'button','data-chip':it.id},it.text);
    makeDrag(c,tid=>place(it.id,tid),()=>{SEL=(SEL&&SEL.q===q.id&&SEL.id===it.id)?null:{q:q.id,id:it.id};api.redo(false);});return c;};
  function place(id,tid){if(tid==='tray'){delete pl[id];}else{const t=targets.find(x=>x.id===tid);if(!t)return;
     if(t.cap===1)items.forEach(o=>{if(pl[o.id]===tid&&o.id!==id)delete pl[o.id];});pl[id]=tid;}
    SEL=null;api.save();api.redo(false);}
  const slotFor=t=>{const s=h('div',{class:'slot','data-drop':t.id});occ(t.id).forEach(it=>s.append(mkChip(it)));
    s.addEventListener('click',e=>{if(e.target.closest('.chip'))return;if(SEL&&SEL.q===q.id)place(SEL.id,t.id);});return s;};
  if(q.mode==='sort'){const g=h('div',{class:'bins'});g.style.gridTemplateColumns=`repeat(${targets.length},minmax(0,1fr))`;
    if(targets.length>2&&window.innerWidth<700)g.style.gridTemplateColumns='1fr';
    targets.forEach(t=>{const b=h('div',{class:'bin'},h('h3',{text:t.label}),slotFor(t));g.append(b);});box.append(g);}
  else{targets.forEach(t=>{box.append(h('div',{class:'mrow'},h('div',{class:'lab',html:t.label}),slotFor(t)));});}
  const tray=h('div',{class:'tray','data-drop':'tray'});
  shuffled(items.filter(it=>pl[it.id]==null),S.seed+q.n*13).forEach(it=>tray.append(mkChip(it)));
  if(!tray.children.length)tray.append(h('span',{class:'hint',text:'All pieces placed. Tap a piece to pick it up and move it.'}));
  tray.addEventListener('click',e=>{if(e.target.closest('.chip'))return;if(SEL&&SEL.q===q.id&&pl[SEL.id]!=null)place(SEL.id,'tray');});
  box.append(tray);},
 answered:(q,a)=>!!a.pl&&Object.keys(a.pl).length>0,
 grade(q,a){const pl=a.pl||{},tn=id=>q.targets.find(t=>t.id===id);
  if(q.mode==='sort')return q.items.map(it=>{const t=pl[it.id];return{ok:t===it.bin,label:it.text,got:t?tn(t).label:'(not placed)',exp:tn(it.bin).label};});
  return q.targets.map(t=>{const it=q.items.find(o=>pl[o.id]===t.id);return{ok:!!it&&it.key===t.expect,label:strip(t.label),got:it?it.text:'(empty)',exp:t.expect};});},
 solve(q){const pl={};if(q.mode==='sort')q.items.forEach(it=>pl[it.id]=it.bin);
  else{const used=new Set();q.targets.forEach(t=>{const it=q.items.find(o=>o.key===t.expect&&!used.has(o.id));if(it){used.add(it.id);pl[it.id]=t.id;}});}return{pl};}};
// FBD
T.fbd={
 render(q,box,a,api){a.sides=a.sides||{};const sides=a.sides;const wrap=h('div',{class:'fbdwrap'});
  const svg=fbdSvg(q,sides,{zones:true,edit:true});
  const used=f=>Object.values(sides).some(x=>x.f===f);
  function put(f,side){for(const s in sides)if(sides[s].f===f)delete sides[s];sides[side]={f,len:2};SEL=null;api.save();api.redo(false);}
  svg.querySelectorAll('[data-drop]').forEach(z=>z.addEventListener('click',()=>{if(SEL&&SEL.q===q.id)put(SEL.id,z.getAttribute('data-drop'));}));
  svg.querySelectorAll('[data-len]').forEach(r=>r.addEventListener('click',()=>{const s=r.getAttribute('data-len');sides[s].len=sides[s].len>=3?1:sides[s].len+1;api.save();api.redo(false);}));
  svg.querySelectorAll('[data-del]').forEach(r=>r.addEventListener('click',e=>{e.stopPropagation();delete sides[r.getAttribute('data-del')];api.save();api.redo(false);}));
  const pal=h('div',{class:'pal'},h('div',{class:'hint',text:'Forces. Drag one to a side of the object, or tap it and then tap a side.'}));

const APP=document.getElementById('app');
